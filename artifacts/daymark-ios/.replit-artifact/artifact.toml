kind = "mobile"
previewPath = "/daymark-ios/"
title = "Daymark iOS"
description = "A native iOS companion for Daymark that brings offline-first tasks, expenses, nutrition, weight tracking, streaks, analytics, and settings into one personal daily ritual."
version = "1.0.0"
id = "artifacts/daymark-ios"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/daymark-ios/" ]
localPort = 21434

[services.development]
run = "pnpm --filter @workspace/daymark-ios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/daymark-ios", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/daymark-ios", "run", "serve" ]

[services.env]
PORT = "21434"
BASE_PATH = "/daymark-ios/"
